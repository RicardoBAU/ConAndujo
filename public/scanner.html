<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Canje - Tienda</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto space-y-6">
        <div class="bg-white rounded-xl shadow-md p-6 text-center">
            <h1 class="text-xl font-bold text-gray-800">📸 Escáner de Caja / Validar Tarjetas</h1>
            <p class="text-sm text-gray-500 mt-1">Apunta la cámara al QR del cliente o escribe el código de folio.</p>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6">
            <div id="reader" class="w-full"></div>
        </div>

        <div class="bg-white rounded-xl shadow-md p-6 flex gap-2">
            <input type="text" id="manualCode" placeholder="Ej. CARD-A1B2" class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono">
            <button onclick="buscarTarjeta(document.getElementById('manualCode').value)" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition cursor-pointer">Buscar</button>
        </div>

        <div id="cardInfoBox" class="hidden bg-white rounded-xl shadow-md p-6 space-y-4">
            <div id="statusBadge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold"></div>
            <div class="space-y-1">
                <p class="text-sm text-gray-500">Folio: <span id="infoId" class="font-mono font-bold text-gray-800"></span></p>
                <p class="text-sm text-gray-500">Cliente: <span id="infoCliente" class="font-semibold text-gray-800"></span></p>
                <p class="text-sm text-gray-500">Beneficio: <span id="infoBeneficio" class="font-semibold text-indigo-600"></span></p>
            </div>
            <div id="actionArea"></div>
        </div>
    </div>

    <script>
        async function buscarTarjeta(id) {
            if (!id) return;
            const res = await fetch(`/api/tarjetas/${id.trim()}`);
            const data = await res.json();
            const box = document.getElementById('cardInfoBox');
            const badge = document.getElementById('statusBadge');
            const actionArea = document.getElementById('actionArea');
            
            box.classList.remove('hidden');
            document.getElementById('infoId').innerText = data.id || id;

            if (res.status !== 200) {
                badge.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700";
                badge.innerText = "No encontrada o inválida";
                document.getElementById('infoCliente').innerText = "-";
                document.getElementById('infoBeneficio').innerText = "-";
                actionArea.innerHTML = "";
                return;
            }

            document.getElementById('infoCliente').innerText = data.cliente_nombre + (data.cliente_correo ? ` (${data.cliente_correo})` : '');
            document.getElementById('infoBeneficio').innerText = data.tipo_promocion;

            if (data.estado === 'activa') {
                badge.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700";
                badge.innerText = "Tarjeta Activa y Válida";
                actionArea.innerHTML = `<button onclick="canjearTarjeta('${data.id}')" class="w-full bg-green-600 text-white py-2.5 rounded-lg font-semibold hover:bg-green-700 transition cursor-pointer">Aplicar / Canjear Promoción</button>`;
            } else {
                badge.className = "inline-block px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700";
                badge.innerText = "Ya utilizada";
                actionArea.innerHTML = `<p class="text-center text-sm text-red-600 font-medium">Esta tarjeta ya fue redimida anteriormente.</p>`;
            }
        }

        async function canjearTarjeta(id) {
            const res = await fetch('/api/tarjetas/canjear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            const data = await res.json();
            if (data.success) {
                alert('¡Promoción aplicada con éxito!');
                buscarTarjeta(id);
            } else {
                alert('Error: ' + data.error);
            }
        }

        function onScanSuccess(decodedText) {
            document.getElementById('manualCode').value = decodedText;
            buscarTarjeta(decodedText);
        }

        let html5QrCode = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }, false);
        html5QrCode.render(onScanSuccess);
    </script>
</body>
</html>
