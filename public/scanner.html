<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Cupones | Con Andujo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-zinc-950 min-h-screen p-6 text-zinc-100 font-sans">
    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- Header Panel -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-center shadow-xl space-y-2">
            <span class="text-xs uppercase tracking-widest text-amber-500 font-semibold bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                Panel de Tienda / Caja
            </span>
            <h1 class="text-2xl font-serif font-bold text-white mt-2">Validador de Cupones Con Andujo</h1>
            <p class="text-xs text-zinc-400">Escanea el código QR del cliente o ingresa el folio manual para aplicar el descuento en la venta.</p>
        </div>

        <!-- Cámara / QR -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl overflow-hidden">
            <div id="reader" class="w-full text-zinc-900 overflow-hidden rounded-xl"></div>
        </div>

        <!-- Búsqueda Manual -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-xl flex gap-2">
            <input type="text" id="manualCode" placeholder="Ej. CARD-A1B2C3D4" class="flex-1 px-4 py-2.5 bg-zinc-800 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 font-mono text-sm focus:outline-none focus:border-amber-500">
            <button onclick="buscarTarjeta(document.getElementById('manualCode').value)" class="bg-amber-500 text-zinc-950 font-bold px-5 py-2.5 rounded-xl hover:bg-amber-400 transition cursor-pointer text-sm uppercase tracking-wide">
                Buscar
            </button>
        </div>

        <!-- Ficha del Cupón -->
        <div id="cardInfoBox" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <span class="text-xs text-zinc-400 font-medium">Estado del Cupón:</span>
                <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></div>
            </div>
            
            <div class="space-y-2 text-sm">
                <p class="text-zinc-400">Folio: <span id="infoId" class="font-mono font-bold text-amber-400"></span></p>
                <p class="text-zinc-400">Cliente: <span id="infoCliente" class="font-semibold text-white"></span></p>
                <p class="text-zinc-400">Beneficio a aplicar: <span id="infoBeneficio" class="font-bold text-amber-500 text-base"></span></p>
            </div>
            
            <div id="actionArea" class="pt-2"></div>
        </div>

    </div>

    <script>
        async function buscarTarjeta(id) {
            if (!id) return;
            const res = await fetch(`/api/tarjetas/${id.trim()}`);
            const data = await res.json();
            const box = document.getElementById('cardInfoBox');
            const badge = document.getElementById('statusBadge');
            const actionArea = document.getElementById('actionArea');
            
            box.classList.remove('hidden');
            document.getElementById('infoId').innerText = data.id || id;

            if (res.status !== 200) {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-red-500/20 text-red-400 border border-red-500/30";
                badge.innerText = "Inválido o No Existe";
                document.getElementById('infoCliente').innerText = "-";
                document.getElementById('infoBeneficio').innerText = "-";
                actionArea.innerHTML = "";
                return;
            }

            document.getElementById('infoCliente').innerText = data.cliente_nombre + (data.cliente_correo ? ` (${data.cliente_correo})` : '');
            document.getElementById('infoBeneficio').innerText = data.tipo_promocion;

            if (data.estado === 'activa') {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                badge.innerText = "✓ Cupón Activo y Válido";
                actionArea.innerHTML = `<button onclick="canjearTarjeta('${data.id}')" class="w-full bg-emerald-500 text-zinc-950 py-3 rounded-xl font-bold uppercase text-sm tracking-wide hover:bg-emerald-400 transition cursor-pointer shadow-lg shadow-emerald-500/10">Aplicar Descuento en Caja</button>`;
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-500/20 text-amber-400 border border-amber-500/30";
                badge.innerText = "⚠ Cupón Ya Utilizado";
                actionArea.innerHTML = `<p class="text-center text-xs text-red-400 font-semibold uppercase bg-red-500/10 py-2.5 rounded-xl border border-red-500/20">Este cupón ya fue redimido previamente.</p>`;
            }
        }

        async function canjearTarjeta(id) {
            const res = await fetch('/api/tarjetas/canjear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            const data = await res.json();
            if (data.success) {
                alert('¡Cupón canjeado con éxito! Descuento aplicado.');
                buscarTarjeta(id);
            } else {
                alert('Error: ' + data.error);
            }
        }

        function onScanSuccess(decodedText) {
            document.getElementById('manualCode').value = decodedText;
            buscarTarjeta(decodedText);
        }

        let html5QrCode = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }, false);
        html5QrCode.render(onScanSuccess);
    </script>
</body>
</html>
