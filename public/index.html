<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital | Con Andujo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full space-y-6">
        
        <!-- Formulario Inicial para Registrarse -->
        <div id="formContainer" class="bg-zinc-900 border border-zinc-800 rounded-3xl shadow-2xl p-8 space-y-6 text-zinc-100">
            <div class="text-center space-y-2">
                <span class="text-xs uppercase tracking-widest text-[#8b1e28] font-semibold bg-[#8b1e28]/10 px-3 py-1 rounded-full border border-[#8b1e28]/20">
                    Membresía Exclusiva
                </span>
                <h1 class="text-3xl font-serif font-bold text-white tracking-wide mt-2">Con Andujo</h1>
                <p class="text-sm text-zinc-400">Ingresa tus datos para generar tu tarjeta digital oficial.</p>
            </div>

            <form id="cardForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 font-medium mb-1">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Ej. Ivan Gerardo Andujo Sandoval" class="w-full px-4 py-3 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-[#8b1e28] transition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 font-medium mb-1">Correo Electrónico</label>
                    <input type="email" id="correo" required placeholder="tu@correo.com" class="w-full px-4 py-3 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-[#8b1e28] transition">
                </div>
                <button type="submit" class="w-full bg-[#8b1e28] text-white font-bold py-3.5 px-4 rounded-xl hover:bg-[#721720] transition shadow-lg cursor-pointer text-sm tracking-wide uppercase">
                    Obtener Mi Tarjeta
                </button>
            </form>
        </div>

        <!-- Tarjeta Digital Estilo ID (Idéntica a la referencia visual) -->
        <div id="cardResult" class="hidden relative max-w-sm mx-auto bg-[#F7F4EE] rounded-[2.5rem] shadow-2xl overflow-hidden border border-[#8b1e28]/30 text-[#4A151B]">
            
            <!-- Contenido Principal de la Tarjeta -->
            <div class="p-8 pb-32 space-y-6">
                <!-- Logotipo Estilizado "A" con carrito -->
                <div class="flex justify-center pt-2">
                    <svg class="w-24 h-24 text-[#8b1e28]" viewBox="0 0 200 200" fill="currentColor">
                        <!-- Representación del isotipo A con carrito -->
                        <path d="M135 30 L160 110 L120 110 L112 85 L75 85 L65 110 L30 110 L85 30 Z" fill="#8b1e28"/>
                        <path d="M85 60 L100 20 L115 60 Z" fill="#F7F4EE"/>
                        <!-- Carrito integrado -->
                        <path d="M45 105 L60 145 C62 150, 68 152, 75 152 L145 152 C152 152, 158 148, 160 142 L175 105 Z" fill="none" stroke="#8b1e28" stroke-width="6"/>
                        <line x1="55" y1="120" x2="165" y2="120" stroke="#8b1e28" stroke-width="4"/>
                        <line x1="70" y1="135" x2="150" y2="135" stroke="#8b1e28" stroke-width="4"/>
                    </svg>
                </div>

                <!-- Nombre y Datos del Titular -->
                <div class="space-y-1">
                    <span class="text-[10px] uppercase tracking-[0.25em] text-[#8b1e28]/70 font-bold">Nombre</span>
                    <h2 id="cardName" class="text-2xl font-serif font-bold text-[#4A151B] leading-tight"></h2>
                </div>

                <!-- Código QR Centrado en Caja Blanca -->
                <div class="flex justify-center pt-2">
                    <div class="bg-white p-4 rounded-2xl shadow-md border border-zinc-200">
                        <div id="qrcode"></div>
                    </div>
                </div>
            </div>

            <!-- Curva Inferior Burgundy con Iconos -->
            <div class="absolute bottom-0 left-0 right-0 h-32 bg-[#7b1720] rounded-t-[3rem] overflow-hidden flex items-center justify-center shadow-inner">
                <!-- Patrón de fondo sutil o iconos decorativos -->
                <div class="absolute inset-0 opacity-10 flex justify-around items-center px-6">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                </div>
                <p class="relative z-10 text-white/90 text-xs font-medium tracking-wider uppercase">Con Andujo • Membresía Oficial</p>
            </div>

        </div>

    </div>

    <script>
        document.getElementById('cardForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;

            const response = await fetch('/api/tarjetas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cliente_nombre: nombre, cliente_correo: correo, tipo_promocion: 'Membresía VIP', valor: 'VIP' })
            });

            const data = await response.json();
            if (data.success) {
                document.getElementById('formContainer').classList.add('hidden');
                document.getElementById('cardResult').classList.remove('hidden');
                document.getElementById('cardName').innerText = nombre;

                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById('qrcode'), { 
                    text: data.id, 
                    width: 140, 
                    height: 140, 
                    colorDark: "#4A151B", 
                    colorLight: "#ffffff" 
                });
            } else {
                alert('Error al generar la tarjeta: ' + data.error);
            }
        });
    </script>
</body>
</html>
