<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupones Digitales | Con Andujo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center p-4 text-zinc-100 font-sans">
    <div class="max-w-md w-full bg-zinc-900 border border-amber-500/20 rounded-3xl shadow-2xl p-8 space-y-6">
        
        <!-- Header / Logo -->
        <div class="text-center space-y-2">
            <span class="text-xs uppercase tracking-widest text-amber-500 font-semibold bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                Club de Beneficios
            </span>
            <h1 class="text-3xl font-serif font-bold text-white tracking-wide mt-2">Con Andujo</h1>
            <p class="text-sm text-zinc-400">Obtén tu **cupón digital exclusivo** y preséntalo en caja para aplicar tu descuento.</p>
        </div>

        <!-- Formulario -->
        <form id="cardForm" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-amber-400/90 font-medium mb-1">Nombre Completo</label>
                <input type="text" id="nombre" required placeholder="Ej. Ricardo Bautista" class="w-full px-4 py-3 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-amber-400/90 font-medium mb-1">Correo Electrónico</label>
                <input type="email" id="correo" required placeholder="tu@correo.com" class="w-full px-4 py-3 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-amber-400/90 font-medium mb-1">Elige tu Cupón o Promoción</label>
                <select id="tipo" class="w-full px-4 py-3 bg-zinc-800/80 border border-zinc-700 rounded-xl text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
                    <option value="Cupón 20% de Descuento">🎟️ Cupón - 20% de Descuento en Compra</option>
                    <option value="Cupón $500 MXN de Regalo">💳 Cupón - $500 MXN de Regalo</option>
                    <option value="Cupón Promoción 2x1">🔥 Cupón - Promoción Especial 2x1</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-bold py-3.5 px-4 rounded-xl hover:from-amber-400 hover:to-amber-500 transition shadow-lg shadow-amber-500/10 cursor-pointer text-sm tracking-wide uppercase">
                Generar Mi Cupón Digital
            </button>
        </form>

        <!-- Resultado: Cupón Digital -->
        <div id="cardResult" class="hidden space-y-4 bg-gradient-to-br from-amber-600 via-amber-700 to-zinc-900 rounded-2xl p-6 text-white shadow-2xl border border-amber-500/40">
            <div class="flex justify-between items-center border-b border-white/15 pb-3">
                <span class="text-xs uppercase tracking-widest font-bold text-amber-200">Cupón Oficial Con Andujo</span>
                <span id="cardIdText" class="font-mono text-xs bg-black/40 px-2 py-1 rounded text-amber-300 font-bold"></span>
            </div>
            <div class="my-2 space-y-1">
                <h3 id="cardBeneficio" class="text-xl font-serif font-bold text-white"></h3>
                <p id="cardName" class="text-xs text-amber-100/90"></p>
            </div>
            <div class="bg-white p-4 rounded-xl flex justify-center items-center shadow-inner">
                <div id="qrcode"></div>
            </div>
            <div class="text-center space-y-1">
                <p class="text-[11px] text-amber-200/90">Muestra este código QR en la caja de la tienda para escanear y aplicar el descuento.</p>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('cardForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const tipo = document.getElementById('tipo').value;

            const response = await fetch('/api/tarjetas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cliente_nombre: nombre, cliente_correo: correo, tipo_promocion: tipo, valor: tipo })
            });

            const data = await response.json();
            if (data.success) {
                document.getElementById('cardForm').classList.add('hidden');
                document.getElementById('cardResult').classList.remove('hidden');
                document.getElementById('cardIdText').innerText = data.id;
                document.getElementById('cardBeneficio').innerText = tipo;
                document.getElementById('cardName').innerText = 'Cliente: ' + nombre;

                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById('qrcode'), { 
                    text: data.id, 
                    width: 160, 
                    height: 160, 
                    colorDark: "#09090b", 
                    colorLight: "#ffffff" 
                });
            } else {
                alert('Error al generar el cupón: ' + data.error);
            }
        });
    </script>
</body>
</html>
