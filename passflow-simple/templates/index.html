<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obtén tu Tarjeta Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold">Registro de Tarjeta Digital</h1>
            <p class="text-slate-400 text-xs mt-1">Ingresa tus datos para generar tu pase de Apple Wallet.</p>
        </div>

        <form id="form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Nombre Completo</label>
                <input type="text" id="name" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Correo Electrónico</label>
                <input type="email" id="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 uppercase mb-1">Teléfono</label>
                <input type="tel" id="phone" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition-all">
                Generar Mi Tarjeta
            </button>
        </form>

        <div id="result" class="hidden mt-6 text-center space-y-4">
            <div class="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400 text-xs">
                ¡Registro exitoso! Folio: <span id="folioText" class="font-mono font-bold"></span>
            </div>
            
            <a id="walletBtn" href="#" class="block w-full bg-black hover:bg-slate-900 border border-slate-700 text-white py-3 rounded-xl transition-all text-center font-medium flex items-center justify-center space-x-2">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.65-.79 1.09-1.89.97-2.99-.96.04-2.13.64-2.82 1.43-.6.68-1.12 1.79-.98 2.86 1.08.08 2.18-.51 2.83-1.3z"/></svg>
                <span>Agregar a Apple Wallet</span>
            </a>
        </div>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value
                })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('form').classList.add('hidden');
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('folioText').innerText = data.folio;
                document.getElementById('walletBtn').href = `/api/pass/${data.folio}`;
            } else {
                alert(data.error);
            }
        });
    </script>
</body>
</html>
