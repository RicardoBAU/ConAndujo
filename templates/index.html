<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Credencial Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1c080a] text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#fbf8f5] text-slate-900 border border-[#e8d8d0] rounded-[32px] p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-[#800020] text-white rounded-2xl mx-auto flex items-center justify-center font-black text-2xl shadow-md mb-3">A</div>
            <h1 class="text-2xl font-black text-[#5c0617]">Registro de Credencial</h1>
            <p class="text-slate-500 text-xs mt-1">Ingresa tus datos para generar tu tarjeta digital oficial.</p>
        </div>

        <form id="form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre Completo</label>
                <input type="text" id="name" required placeholder="Ej. Juan Pérez" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#800020]">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#800020]">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Teléfono</label>
                <input type="tel" id="phone" required placeholder="10 dígitos" class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#800020]">
            </div>
            <button type="submit" class="w-full bg-[#800020] hover:bg-[#600018] text-white font-bold py-3.5 rounded-xl transition-all shadow-lg">
                Generar Mi Tarjeta
            </button>
        </form>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value
                })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = `/card/${data.folio}`;
            } else {
                alert(data.error);
            }
        });
    </script>
</body>
</html>
