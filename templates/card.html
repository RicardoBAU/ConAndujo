<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Tarjeta Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-[#1c080a] text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Tarjeta Principal con el diseño exacto -->
    <div class="max-w-sm w-full bg-[#fbf8f5] text-slate-900 rounded-[32px] shadow-2xl overflow-hidden border border-[#e8d8d0] relative flex flex-col justify-between">
        
        <!-- Parte Superior: Logotipo y Nombre Dinámico -->
        <div class="p-7 pb-4">
            <!-- Logotipo de la Letra 'A' con carrito estilizado -->
            <div class="flex justify-center mb-6">
                <div class="relative flex items-center justify-center">
                    <svg class="w-20 h-20 text-[#800020]" viewBox="0 0 100 100" fill="currentColor">
                        <path d="M25 45H75L70 70H30L25 45Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M35 45L50 20L65 45" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="20" y1="35" x2="30" y2="35" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                        <line x1="15" y1="27" x2="25" y2="27" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="38" cy="78" r="5" fill="currentColor"/>
                        <circle cx="62" cy="78" r="5" fill="currentColor"/>
                    </svg>
                </div>
            </div>

            <!-- Datos del Cliente (Dinámicos) -->
            <div class="mt-2">
                <span class="text-[11px] tracking-widest text-[#800020] font-black uppercase block">NOMBRE</span>
                <h2 class="text-3xl font-black text-[#5c0617] mt-1 leading-tight break-words">{{ user.name }}</h2>
                <p class="text-xs text-slate-500 font-mono mt-1">Folio: {{ user.folio }}</p>
            </div>
        </div>

        <!-- Parte Inferior: Bloque Borgoña con Código QR -->
        <div class="bg-[#800020] pt-6 pb-8 px-6 rounded-t-[36px] mt-6 flex flex-col items-center shadow-inner relative">
            <div class="bg-white p-4 rounded-2xl shadow-xl">
                <div id="qrcode"></div>
            </div>
            <p class="text-[11px] text-[#f4d0d6] mt-3 font-semibold tracking-wide">Muestra este código en caja</p>
        </div>
    </div>

    <!-- Botones de Acción -->
    <div class="max-w-sm w-full mt-6 space-y-3">
        <a href="/api/pass/{{ user.folio }}" class="block w-full bg-white hover:bg-slate-100 text-slate-900 py-3.5 rounded-2xl transition-all text-center font-bold text-sm shadow-lg flex items-center justify-center space-x-2">
            <svg class="w-5 h-5 fill-current text-slate-900" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.65-.79 1.09-1.89.97-2.99-.96.04-2.13.64-2.82 1.43-.6.68-1.12 1.79-.98 2.86 1.08.08 2.18-.51 2.83-1.3z"/></svg>
            <span>Agregar a Apple Wallet</span>
        </a>
        <a href="/" class="block w-full text-center text-xs text-slate-400 hover:text-white transition-all py-2">
            ← Registrar otro cliente
        </a>
    </div>

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "{{ user.folio }}",
            width: 160,
            height: 160
        });
    </script>
</body>
</html>
